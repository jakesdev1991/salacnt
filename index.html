<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Salon Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --surface: #ffffff;
      --text-main: #333333;
      --text-light: #666666;
      --danger: #ff6b6b;
      --success: #2ecc71;
      --border-radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      padding: 20px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      min-height: 80vh;
      position: relative;
      padding-bottom: 80px; /* Space for tab bar if we moved it bottom, but it's top now */
    }

    .header {
      background: var(--bg-gradient);
      color: white;
      padding: 30px 20px;
      text-align: center;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      margin-bottom: 20px;
    }

    .header h1 { font-size: 28px; margin-bottom: 5px; font-weight: 700; letter-spacing: -0.5px; }
    .header #user { font-size: 14px; opacity: 0.9; font-weight: 500; }

    /* Stats Cards */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 0 20px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: transform 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    
    .stat-card:active { transform: scale(0.98); }

    .stat-card big {
      font-size: 24px;
      font-weight: 700;
      color: var(--secondary);
      display: block;
      margin-bottom: 4px;
    }
    
    .stat-card span { font-size: 12px; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Navigation */
    .tabs {
      display: flex;
      background: #f1f2f6;
      margin: 0 20px 20px;
      border-radius: 12px;
      padding: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 1;
      padding: 10px 5px;
      text-align: center;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      border-radius: 10px;
      font-size: 11px;
      transition: all 0.3s ease;
      min-width: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .tab i { font-size: 20px; margin-bottom: 2px; display: block; }
    .tab.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

    /* Panels */
    .panel { display: none; padding: 0 20px 20px; animation: fadeIn 0.4s ease-out; }
    .panel.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Form Elements */
    .form-group { margin-bottom: 15px; }
    
    input, select, textarea {
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;
      border: 2px solid #f0f0f0;
      border-radius: 12px;
      font-size: 15px;
      transition: border-color 0.3s, box-shadow 0.3s;
      background: #fcfcfc;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      outline: none;
      background: white;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .row-inputs { display: flex; gap: 10px; }
    .row-inputs > * { flex: 1; }

    button.primary-btn {
      width: 100%;
      padding: 18px;
      background: var(--bg-gradient);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 10px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(118, 75, 162, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button.primary-btn:active { transform: scale(0.98); box-shadow: 0 5px 10px rgba(118, 75, 162, 0.2); }

    .total-display {
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      margin: 25px 0;
      color: var(--secondary);
      letter-spacing: -1px;
    }

    /* List Items */
    .list-item {
      padding: 15px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 8px;
    }
    
    .list-item:hover { background: #f9f9f9; }
    .list-item b { color: var(--text-main); font-size: 15px; }
    .list-item small { color: var(--text-light); }

    /* Inventory Row */
    .inv-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: white;
      border: 1px solid #eee;
      margin-bottom: 8px;
      border-radius: 12px;
    }

    .qty-controls button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    
    .qty-controls button:active { transform: scale(0.9); }
    .btn-minus { background: var(--danger); margin-right: 5px; }
    .btn-plus { background: var(--primary); }

    /* Loader */
    .loader {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e1e1e1;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="loader" id="loader"><div class="spinner"></div></div>

<div class="container">
  <div class="header">
    <h1>Salon Pro</h1>
    <div id="user">Loading...</div>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <big id="todaySales">$0</big>
      <span>Today's Sales</span>
    </div>
    <div class="stat-card">
      <big id="todayClients">0</big>
      <span>Clients</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('sale', this)">
      <i class="material-icons">point_of_sale</i>Sale
    </div>
    <div class="tab" onclick="switchTab('inventory', this)">
      <i class="material-icons">inventory</i>Stock
    </div>
    <div class="tab" onclick="switchTab('expense', this)">
      <i class="material-icons">receipt_long</i>Expense
    </div>
    <div class="tab" onclick="switchTab('clients', this)">
      <i class="material-icons">people</i>Clients
    </div>
    <div class="tab" onclick="switchTab('appts', this)">
      <i class="material-icons">event</i>Book
    </div>
  </div>

  <!-- SALE TAB -->
  <div id="sale" class="panel active">
    <input type="text" id="cName" placeholder="Client Name *">
    <input type="tel" id="cPhone" placeholder="Phone Number">
    
    <select id="type">
      <option>Service</option>
      <option>Product</option>
    </select>
    
    <input type="text" id="item" placeholder="Service / Product Name *">
    
    <div class="row-inputs">
        <input type="number" id="price" placeholder="Price *" step="0.01" oninput="calcTotal()">
        <input type="number" id="qty" placeholder="Qty" value="1" min="1" oninput="calcTotal()">
    </div>
    
    <div class="row-inputs">
        <input type="number" id="tip" placeholder="Tip" step="0.01" oninput="calcTotal()">
        <input type="number" id="taxRate" placeholder="Tax %" value="8.875" step="0.001" oninput="calcTotal()">
    </div>
    
    <select id="pay">
      <option>Cash</option>
      <option>Card</option>
      <option>Venmo</option>
      <option>Zelle</option>
    </select>
    
    <div class="total-display" id="total">$0.00</div>
    
    <button class="primary-btn" onclick="saveSale()">Complete Sale</button>
  </div>

  <!-- INVENTORY TAB -->
  <div id="inventory" class="panel">
    <input type="text" id="searchInv" placeholder="Search stock..." onkeyup="filterInv()">
    <div id="invList" style="max-height:400px; overflow-y:auto; margin-bottom:15px;">Loading...</div>
    
    <hr style="border:0; border-top:1px solid #eee; margin: 15px 0;">
    <h3 style="margin-bottom:10px; font-size:14px; color:var(--text-light);">Add New Item</h3>
    <input type="text" id="newItem" placeholder="New item name">
    <input type="number" id="newQty" placeholder="Quantity">
    <button class="primary-btn" onclick="addItem()">Add / Restock</button>
  </div>

  <!-- EXPENSE TAB (NEW) -->
  <div id="expense" class="panel">
    <h3 style="margin-bottom:10px; font-size:14px; color:var(--text-light);">Log Expense</h3>
    <input type="text" id="expDesc" placeholder="Description (e.g., Rent, Supplies)">
    <input type="number" id="expAmt" placeholder="Amount ($)" step="0.01">
    <button class="primary-btn" onclick="saveExpense()">Save Expense</button>
    
    <div id="expList" style="margin-top:25px; max-height:400px; overflow-y:auto;">Loading recent...</div>
  </div>

  <!-- CLIENTS TAB -->
  <div id="clients" class="panel">
    <input type="text" id="searchC" placeholder="Search clients..." onkeyup="filterClients()">
    <div id="clientList" style="max-height:500px; overflow-y:auto;">Loading...</div>
  </div>

  <!-- APPOINTMENTS TAB -->
  <div id="appts" class="panel">
    <div class="row-inputs">
      <input type="date" id="aDate">
      <input type="time" id="aTime">
    </div>
    <input type="text" id="aName" placeholder="Client Name">
    <input type="text" id="aService" placeholder="Service">
    <button class="primary-btn" onclick="book()">Book Appointment</button>
    
    <div id="apptList" style="margin-top:25px;"></div>
  </div>

</div>

<script>
// --- UTILS ---
const loader = document.getElementById('loader');
const showLoader = () => loader.style.display = 'flex';
const hideLoader = () => loader.style.display = 'none';

// --- TABS ---
function switchTab(id, el) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
  
  if(id === 'inventory') loadInv();
  if(id === 'expense') loadExpenses(); // NEW
  if(id === 'clients') loadClients();
  if(id === 'appts') loadAppts();
}

// --- CALCULATOR ---
function calcTotal() {
  let p = parseFloat(document.getElementById('price').value) || 0;
  let q = parseFloat(document.getElementById('qty').value) || 1;
  let tip = parseFloat(document.getElementById('tip').value) || 0;
  let taxR = parseFloat(document.getElementById('taxRate').value) || 0;
  
  let sub = p * q;
  let tax = sub * (taxR / 100);
  let total = sub + tip + tax;
  
  document.getElementById('total').innerText = '$' + total.toFixed(2);
}

// --- INIT ---
window.onload = () => {
  document.getElementById('aDate').min = new Date().toISOString().split('T')[0];
  
  google.script.run.withSuccessHandler(email => {
    document.getElementById('user').innerText = email;
  }).getUserEmail();
  
  loadStats();
};

// --- SALE LOGIC ---
function saveSale() {
  let name = document.getElementById('cName').value;
  let item = document.getElementById('item').value;
  let price = document.getElementById('price').value;
  
  if (!name || !item || !price) { alert('Please fill in Client Name, Item, and Price.'); return; }
  
  showLoader();
  
  let data = {
    client: name,
    phone: document.getElementById('cPhone').value,
    type: document.getElementById('type').value,
    item: item,
    price: parseFloat(price),
    qty: parseFloat(document.getElementById('qty').value) || 1,
    tip: parseFloat(document.getElementById('tip').value) || 0,
    taxRate: parseFloat(document.getElementById('taxRate').value) || 0,
    pay: document.getElementById('pay').value
  };
  
  google.script.run.withSuccessHandler(() => {
    hideLoader();
    alert('Sale Saved & Receipt Generated!');
    // Reset fields
    document.getElementById('item').value = '';
    document.getElementById('price').value = '';
    document.getElementById('qty').value = '1';
    document.getElementById('tip').value = '';
    document.getElementById('total').innerText = '$0.00';
    loadStats();
  }).processSale(data);
}

// --- EXPENSE LOGIC (NEW) ---
function saveExpense() {
  let desc = document.getElementById('expDesc').value;
  let amt = parseFloat(document.getElementById('expAmt').value);
  
  if (!desc || !amt) { alert('Please fill in Description and Amount.'); return; }
  
  showLoader();
  google.script.run.withSuccessHandler(() => {
    hideLoader();
    alert('Expense Saved!');
    document.getElementById('expDesc').value = '';
    document.getElementById('expAmt').value = '';
    loadExpenses();
  }).saveExpense(desc, amt);
}

function loadExpenses() {
  google.script.run.withSuccessHandler(expenses => {
    let html = '';
    expenses.slice(-10).reverse().forEach(e => { // Last 10, newest first
      html += `<div class="list-item" style="cursor:default;">
                 <b>${e[1]}</b><br><small>$${e[2].toFixed(2)} on ${new Date(e[0]).toLocaleDateString()}</small>
               </div>`;
    });
    document.getElementById('expList').innerHTML = html || '<div style="text-align:center;color:#999;padding:20px;">No recent expenses.</div>';
  }).getRecentExpenses();
}

// --- CLIENTS ---
function loadClients() {
  google.script.run.withSuccessHandler(arr => {
    let html = '';
    arr.forEach(c => {
       let safeName = c[0].replace(/'/g, "\\'"); 
       let phone = c[1] || '';
       html += `<div class="list-item" onclick="pickClient('${safeName}','${phone}')">
                  <b>${c[0]}</b><br><small>${phone}</small>
                </div>`;
    });
    document.getElementById('clientList').innerHTML = html || '<div style="text-align:center;color:#999;padding:20px;">No clients found.</div>';
  }).getClients();
}

function pickClient(n, p) {
  document.getElementById('cName').value = n;
  document.getElementById('cPhone').value = p;
  // Switch to sale tab
  const saleTab = document.querySelector('.tab[onclick*="sale"]');
  switchTab('sale', saleTab);
}

function filterClients() {
  let term = document.getElementById('searchC').value.toLowerCase();
  document.querySelectorAll('#clientList .list-item').forEach(d => {
    d.style.display = d.innerText.toLowerCase().includes(term) ? 'block' : 'none';
  });
}

// --- INVENTORY ---
function loadInv() {
  google.script.run.withSuccessHandler(arr => {
    let html = '';
    arr.forEach(i => {
       let safeItem = i[0].replace(/'/g, "\\'");
       html += `<div class="inv-row">
                  <div><b>${i[0]}</b><br><small>Qty: ${i[1]}</small></div>
                  <div class="qty-controls">
                     <button class="btn-minus" onclick="adjStock('${safeItem}', -1)">-</button>
                     <button class="btn-plus" onclick="adjStock('${safeItem}', 1)">+</button>
                  </div>
                </div>`;
    });
    document.getElementById('invList').innerHTML = html || '<div style="text-align:center;color:#999;padding:20px;">Inventory empty.</div>';
  }).getInventory();
}

function filterInv() {
  let term = document.getElementById('searchInv').value.toLowerCase();
  document.querySelectorAll('#invList .inv-row').forEach(d => {
    d.style.display = d.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
  });
}

function addItem() {
  let n = document.getElementById('newItem').value;
  let q = document.getElementById('newQty').value;
  if(!n || !q) return;
  
  showLoader();
  google.script.run.withSuccessHandler(() => {
    hideLoader();
    loadInv();
    document.getElementById('newItem').value = '';
    document.getElementById('newQty').value = '';
  }).adjustStock(n, q);
}

function adjStock(i, q) {
  showLoader();
  google.script.run.withSuccessHandler(() => {
    hideLoader();
    loadInv();
  }).adjustStock(i, q);
}

// --- APPOINTMENTS ---
function book() {
  let d = document.getElementById('aDate').value;
  let t = document.getElementById('aTime').value;
  let n = document.getElementById('aName').value;
  let s = document.getElementById('aService').value;
  
  if(!d || !t || !n) return;
  
  showLoader();
  google.script.run.withSuccessHandler(() => {
    hideLoader();
    alert('Appointment Booked!');
    loadAppts();
    // Clear fields
    document.getElementById('aName').value = '';
    document.getElementById('aService').value = '';
  }).bookAppt(d, t, n, s);
}

function loadAppts() {
  google.script.run.withSuccessHandler(arr => {
    let html = '';
    arr.forEach(a => { 
        // Date formatting
        let dateObj = new Date(a[0]);
        let dateStr = dateObj.toLocaleDateString();
        html += `<div class="list-item" style="cursor:default;">
                    <span style="color:var(--primary);font-weight:600;">${dateStr} @ ${a[1]}</span><br>
                    <b>${a[2]}</b> (${a[3]})
                 </div>`; 
    });
    document.getElementById('apptList').innerHTML = html || '<div style="text-align:center;color:#999;padding:20px;">No upcoming appointments.</div>';
  }).getAppts();
}

// --- STATS ---
function loadStats() {
  google.script.run.withSuccessHandler(s => {
    document.getElementById('todaySales').innerText = '$' + s.rev;
    document.getElementById('todayClients').innerText = s.clients;
  }).getTodayStats();
}
</script>
</body>
</html>
